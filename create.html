    <style>
        .create-page .container {
            max-width: 100%;
            margin: 0;
            padding: 0;
        }

        /* ===== 顶层布局 ===== */
        .create-wrapper {
            display: flex;
            height: calc(100vh - 60px);
            margin-top: 60px;
        }

        /* ===== 左侧面板 ===== */
        .create-sidebar {
            width: 300px;
            min-width: 300px;
            background: #f8f9fc;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== 右侧面板 ===== */
        .create-sidebar-right {
            width: 260px;
            min-width: 260px;
            background: #f8f9fc;
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
        }

        .sidebar-scroll::-webkit-scrollbar { width: 4px; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }

        /* 工具按钮行（绘制工具一组） */
        .tool-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .tool-bar .tool-btn {
            flex: 1;
            min-width: 0;
            padding: 8px 2px 7px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            background: #fff;
            cursor: pointer;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            line-height: 1.2;
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            transition: all 0.18s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .tool-bar .tool-icon {
            font-size: 1.05rem;
            line-height: 1;
            pointer-events: none;
        }
        .tool-bar .tool-label {
            font-size: 0.72rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .tool-bar .tool-btn:hover {
            border-color: var(--primary-color);
            background: rgba(124, 127, 179, 0.08);
            transform: translateY(-1px);
        }
        .tool-bar .tool-btn:active { transform: translateY(0); }
        .tool-bar .tool-btn:focus-visible {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }
        .tool-bar .tool-btn.active {
            background: var(--bg-gradient);
            border-color: var(--primary-color);
            box-shadow: 0 3px 10px rgba(124, 127, 179, 0.28);
        }
        .tool-bar .tool-btn.active .tool-label { color: #fff; }

        /* 视图开关行：独立一行，图标+文字横向 */
        .tool-bar--view .tool-btn {
            flex-direction: row;
            justify-content: center;
            gap: 6px;
            padding: 8px 12px;
        }
        .tool-bar--view .tool-label { font-size: 0.78rem; }
        .color-cell-label {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            line-height: 1;
            pointer-events: none;
        }

        /* 设置行（网格+色卡） */
        .settings-row {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .settings-row select {
            flex: 1;
            min-width: 0;
            padding: 6px 8px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.8rem;
            background: white;
        }
        .settings-row select:focus { outline: none; border-color: var(--primary-color); }
        .settings-row input[type="number"] {
            width: 48px;
            padding: 6px 4px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.8rem;
            text-align: center;
        }

        /* 当前颜色显示 */
        .current-color-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: white;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 2px solid var(--border-color);
        }
        .current-color-swatch {
            width: 32px; height: 32px;
            border-radius: 6px;
            border: 2px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            flex-shrink: 0;
        }
        .current-color-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-dark);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 色板 */
        .palette-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(30px, 1fr));
            gap: 3px;
            margin-bottom: 12px;
        }
        .palette-grid .color-cell {
            aspect-ratio: 1;
            border-radius: 3px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.12s ease;
            position: relative;
        }
        .palette-grid .color-cell:hover {
            transform: scale(1.25);
            z-index: 2;
            border-color: #333;
        }
        .palette-grid .color-cell.selected {
            border-color: #333;
            box-shadow: 0 0 0 2px white, 0 0 0 4px #333;
        }

        /* 可折叠区域 */
        .collapse-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 8px;
            margin: 6px 0 2px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-dark);
            user-select: none;
            border-top: 1px solid var(--border-color);
            border-radius: 8px;
            transition: background 0.15s ease;
        }
        .collapse-header:first-child { border-top: none; margin-top: 0; }
        .collapse-header:hover { background: rgba(124, 127, 179, 0.08); }
        .collapse-header::after {
            content: '▾';
            font-size: 0.7rem;
            color: var(--text-muted);
            transition: transform 0.2s;
        }
        .collapse-header.collapsed::after { transform: rotate(-90deg); }
        .collapse-body { overflow: hidden; transition: max-height 0.25s ease; max-height: 500px; }
        .collapse-body.collapsed { max-height: 0; }

        /* 导入区 */
        .import-area {
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            padding: 16px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            margin-bottom: 8px;
        }
        .import-area:hover { border-color: var(--primary-color); background: rgba(244,160,184,0.04); }
        .import-area.dragover { border-color: var(--secondary-color); transform: scale(1.02); }
        .import-area .icon { font-size: 1.8rem; margin-bottom: 4px; }
        .import-area .label { font-size: 0.85rem; font-weight: 600; }
        .import-area .hint { font-size: 0.75rem; color: var(--text-muted); }

        /* 参数行（标签 + 控件统一布局） */
        .param-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 0;
        }
        .param-row .param-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-dark);
            flex-shrink: 0;
            min-width: 34px;
        }
        .param-row .param-value {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary-color);
            background: rgba(124, 127, 179, 0.12);
            border-radius: 20px;
            padding: 2px 10px;
            min-width: 30px;
            text-align: center;
            flex-shrink: 0;
        }

        /* 滑块（品牌色自定义轨道与滑块头） */
        .param-row input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: rgba(124, 127, 179, 0.18);
            outline: none;
            cursor: pointer;
        }
        .param-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--bg-gradient);
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(124, 127, 179, 0.4);
            cursor: grab;
        }
        .param-row input[type="range"]::-webkit-slider-thumb:active { cursor: grabbing; }
        .param-row input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary-color);
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(124, 127, 179, 0.4);
            cursor: grab;
        }
        .param-row input[type="range"]::-moz-range-track {
            height: 6px;
            border-radius: 3px;
            background: rgba(124, 127, 179, 0.18);
        }

        /* 效果切换 */
        .effect-toggle {
            flex: 1;
            display: flex;
            gap: 4px;
            background: rgba(124, 127, 179, 0.12);
            border-radius: 10px;
            padding: 3px;
        }
        .effect-toggle .effect-btn {
            flex: 1;
            padding: 6px 4px;
            border: none;
            border-radius: 8px;
            background: transparent;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
        }
        .effect-toggle .effect-btn:hover { background: rgba(255,255,255,0.7); }
        .effect-toggle .effect-btn.active {
            background: var(--bg-gradient);
            color: #fff;
            box-shadow: 0 2px 8px rgba(124, 127, 179, 0.3);
        }

        /* 自动抠图进度条 */
        .cutout-progress {
            margin: 10px 0 2px;
            background: #f0f0f5;
            border-radius: 20px;
            height: 18px;
            position: relative;
            overflow: hidden;
        }
        .cutout-progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #F4A0B8, #8A6FE8);
            border-radius: 20px;
            transition: width 0.2s ease;
        }
        .cutout-progress-pct {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.25);
            pointer-events: none;
            line-height: 1;
        }
        .cutout-progress.error .cutout-progress-bar {
            background: #E24B4A;
        }
        .cutout-progress-text {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
            text-align: center;
            min-height: 1em;
        }
        .cutout-progress.error ~ .cutout-progress-text {
            color: #C0392B;
        }

        /* 统计 */
        .stats-text { font-size: 0.82rem; color: var(--text-dark); line-height: 1.7; }
        .stats-text b { color: var(--primary-color); }
        .stats-color-list {
            max-height: 110px;
            overflow-y: auto;
            font-size: 0.78rem;
            margin-top: 6px;
        }
        .stats-color-list::-webkit-scrollbar { width: 3px; }
        .stats-color-list::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

        /* 按钮区域 */
        .action-row {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }
        .action-row .btn {
            flex: 1;
            min-height: 40px;
            padding: 8px 12px;
            font-size: 0.82rem;
            justify-content: center;
        }
        /* 全宽按钮（导入并像素化） */
        .btn-block {
            width: 100%;
            justify-content: center;
        }

        /* 缩略图操作按钮组（2×2 网格） */
        .thumb-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 8px;
        }
        .thumb-actions .btn {
            min-height: 34px;
            padding: 6px 4px;
            font-size: 0.75rem;
            justify-content: center;
        }

        /* ===== 右侧画布区 ===== */
        .create-canvas-area {
            flex: 1;
            display: flex;
            background: #f0f1f5;
            overflow: hidden;
            padding: 20px;
            position: relative;
        }
        /* canvas 用 margin:auto 居中：容器溢出时左上角仍可滚动到（flex justify-content 居中会裁掉负坐标部分） */
        .create-canvas-area canvas {
            margin: auto;
            flex-shrink: 0;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: crosshair;
            background: white;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        .create-zoom-control {
            position: absolute;
            top: 28px;
            right: 28px;
            display: flex;
            align-items: center;
            gap: 2px;
            background: rgba(26,26,46,0.85);
            padding: 3px;
            border-radius: 12px;
            z-index: 10;
        }
        .create-zoom-control button {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            min-width: 30px;
            height: 28px;
            border-radius: 8px;
            cursor: pointer;
            line-height: 1;
            padding: 0;
            font-family: inherit;
        }
        .create-zoom-control button:hover { background: rgba(255,255,255,0.15); }
        .create-zoom-control button:active { background: rgba(255,255,255,0.28); }
        .create-zoom-control #createZoomBadge {
            font-size: 12px;
            font-weight: 600;
            min-width: 52px;
            letter-spacing: 0.3px;
        }
        .canvas-tip {
            color: var(--text-muted);
            font-size: 1rem;
            text-align: center;
        }
        .canvas-tip span { font-size: 3rem; display: block; margin-bottom: 10px; }

        /* ===== 响应式: 平板横向 ===== */
        @media (max-width: 1024px) {
            .create-wrapper {
                flex-direction: column;
                height: auto;
                min-height: calc(100vh - 60px);
            }
            .create-sidebar {
                width: 100%;
                min-width: 0;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                max-height: 45vh;
            }
            .sidebar-scroll {
                padding: 10px 14px;
            }
            .palette-grid {
                grid-template-columns: repeat(auto-fill, minmax(34px, 1fr));
                max-height: 140px;
            }
            .create-canvas-area {
                min-height: 50vh;
                padding: 12px;
            }

            /* Tablet: bigger touch targets */
            .tool-bar .tool-btn {
                min-height: 52px;
                padding: 10px 4px 9px;
            }
            .tool-bar .tool-icon { font-size: 1.2rem; }
            .tool-bar .tool-label { font-size: 0.8rem; }
            .settings-row select,
            .settings-row input[type="number"] {
                min-height: 40px;
                font-size: 0.9rem;
            }
            .palette-grid .color-cell {
                min-width: 36px;
                min-height: 36px;
            }
            .import-area {
                padding: 20px 12px;
            }
            .action-row .btn {
                min-height: 44px;
                font-size: 0.9rem;
            }
        }

        /* ===== 响应式: 平板 ===== */
        @media (max-width: 1100px) {
            .create-sidebar { width: 260px; min-width: 260px; }
            .create-sidebar-right { width: 230px; min-width: 230px; }
        }

        /* ===== 响应式: 小平板 / 手机 ===== */
        @media (max-width: 900px) {
            .create-wrapper { flex-wrap: wrap; height: auto; }
            .create-sidebar {
                width: 50%; min-width: 0; max-height: 40vh;
            }
            .create-sidebar-right {
                width: 50%; min-width: 0; max-height: 40vh;
                border-left: 1px solid var(--border-color);
            }
            .create-canvas-area { min-height: 55vh; padding: 10px; width: 100%; }
            .palette-grid {
                grid-template-columns: repeat(auto-fill, minmax(32px, 1fr));
                max-height: 100px;
            }
        }

        /* ===== 响应式: 手机 ===== */
        @media (max-width: 640px) {
            .collapse-body.collapsed-mobile { max-height: 0; }
            .collapse-header.collapsed-mobile::after { transform: rotate(-90deg); }
            .create-wrapper { margin-top: 50px; min-height: auto; flex-wrap: wrap; }
            .create-sidebar { width: 100%; max-height: 35vh; border-right: none; border-bottom: 1px solid var(--border-color); }
            .create-sidebar-right { width: 100%; max-height: 35vh; border-left: none; }
            .sidebar-scroll { padding: 8px 10px; }
            .tool-bar { gap: 6px; margin-bottom: 10px; }
            .tool-bar .tool-btn { min-height: 44px; padding: 7px 2px 6px; }
            .tool-bar .tool-icon { font-size: 1rem; }
            .tool-bar .tool-label { font-size: 0.68rem; }
            .tool-bar--view .tool-btn { padding: 8px 10px; }
            .palette-grid {
                grid-template-columns: repeat(auto-fill, minmax(28px, 1fr));
                gap: 2px;
                max-height: 80px;
            }
            .create-canvas-area { min-height: 50vh; padding: 8px; width: 100%; }
            .current-color-bar { padding: 6px 10px; }
            .current-color-swatch { width: 26px; height: 26px; }
        }

        /* ===== 裁剪弹窗 ===== */
        .crop-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0,0,0,0.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .crop-modal.show { display: flex; }
        .crop-modal-box {
            background: #fff;
            border-radius: 12px;
            width: min(92vw, 560px);
            max-height: 88vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
            overflow: hidden;
        }
        .crop-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 0.95rem;
            border-bottom: 1px solid var(--border-color);
        }
        .crop-close {
            background: none;
            border: none;
            font-size: 1.1rem;
            line-height: 1;
            cursor: pointer;
            color: var(--text-muted);
            padding: 4px 6px;
            border-radius: 6px;
        }
        .crop-close:hover { background: rgba(0,0,0,0.06); }
        .crop-stage {
            position: relative;
            margin: 16px;
            max-height: 55vh;
            overflow: hidden;
            background: #ececf2;
            border-radius: 8px;
            cursor: crosshair;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .crop-stage img {
            display: block;
            max-width: 100%;
            max-height: 55vh;
            margin: 0 auto;
            pointer-events: none;
        }
        .crop-mask { position: absolute; background: rgba(0,0,0,0.45); pointer-events: none; }
        .crop-select {
            position: absolute;
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.85);
            box-sizing: border-box;
            pointer-events: none;
        }
        .crop-modal-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
        }
        .crop-info {
            font-size: 0.8rem;
            color: var(--text-muted);
            flex: 1;
            min-width: 120px;
        }
        .crop-actions { display: flex; gap: 8px; }
        .crop-actions .btn { padding: 8px 14px; font-size: 0.85rem; }
    </style>
</head>
<body class="create-page">
    <div id="navbar-placeholder"></div>

    <div class="create-wrapper">
        <!-- 左侧面板 -->
        <div class="create-sidebar">
            <div class="sidebar-scroll">

                <!-- 工具行：绘制工具一组 -->
                <div class="tool-bar">
                    <button class="tool-btn active" data-tool="paint" id="paintTool" title="涂色">
                        <span class="tool-icon">✏️</span><span class="tool-label">涂色</span>
                    </button>
                    <button class="tool-btn" data-tool="eraser" id="eraserTool" title="擦除">
                        <span class="tool-icon">🧹</span><span class="tool-label">擦除</span>
                    </button>
                    <button class="tool-btn" data-tool="fill" id="fillTool" title="填充">
                        <span class="tool-icon">🪣</span><span class="tool-label">填充</span>
                    </button>
                    <button class="tool-btn" data-tool="move" id="moveTool" title="移动画布">
                        <span class="tool-icon">✋</span><span class="tool-label">移动</span>
                    </button>
                </div>
                <!-- 视图开关：独立一行 -->
                <div class="tool-bar tool-bar--view">
                    <button class="tool-btn tool-btn--switch active" id="labelToggleBtn" title="显示/隐藏格子色号">
                        <span class="tool-icon">🔤</span><span class="tool-label">显示色号</span>
                    </button>
                </div>

                <!-- 设置 -->
                <div class="settings-row">
                    <select id="editorGridSize">
                        <option value="15x15">15×15</option>
                        <option value="29x29">29×29</option>
                        <option value="32x32">32×32</option>
                        <option value="58x58" selected>58×58</option>
                        <option value="64x64">64×64</option>
                        <option value="87x58">87×58</option>
                        <option value="104x104">104×104</option>
                        <option value="custom">自定义</option>
                    </select>
                    <select id="editorPalette">
                        <option value="mard291">MARD</option>
                        <option value="mard221" selected>MARD 221</option>
                        <option value="artkal">Artkal</option>
                        <option value="perler">Perler</option>
                        <option value="hama">Hama</option>
                    </select>
                </div>
                <div class="settings-row" id="editorCustomGrid" style="display:none">
                    <input type="number" id="editorGridW" min="5" max="252" value="58"> ×
                    <input type="number" id="editorGridH" min="5" max="252" value="58">
                    <span style="font-size:0.75rem;color:var(--text-muted)">(5-252)</span>
                </div>
                <!-- 当前颜色 -->
                <div class="current-color-bar">
                    <div class="current-color-swatch" id="currentColorSwatch" style="background:#e0e0e0"></div>
                    <span class="current-color-name" id="currentColorName">选择颜色</span>
                </div>

                <!-- 色板 -->
                <div class="palette-grid" id="editorPaletteGrid"></div>

            </div>
        </div>

        <!-- 中间画布 -->
        <div class="create-canvas-area" id="editorCanvasArea">
            <canvas id="editorCanvas"></canvas>
            <div class="create-zoom-control">
                <button id="createZoomOut" title="缩小">−</button>
                <button id="createZoomBadge" title="点击恢复适应屏幕">100%</button>
                <button id="createZoomIn" title="放大">＋</button>
            </div>
            <div class="canvas-tip" id="canvasTip" style="display:none">
                <span>🖌️</span>
                <p>选择颜色后点击格子开始涂色</p>
            </div>
        </div>

        <!-- 右侧面板：导入、统计、操作 -->
        <div class="create-sidebar-right">
            <div class="sidebar-scroll">

                <!-- 导入图片（可折叠） -->
                <div class="collapse-header" id="importHeader">📥 导入图片</div>
                <div class="collapse-body" id="importBody">
                    <div class="import-area" id="editorUploadArea">
                        <input type="file" id="editorImageInput" accept="image/*" style="display:none">
                        <div class="icon">📷</div>
                        <div class="label">上传图片</div>
                        <div class="hint">转为拼豆后逐格修改</div>
                    </div>
                    <div class="param-row">
                        <span class="param-label">颜色</span>
                        <input type="range" id="editorImportColors" min="2" max="291" value="48">
                        <span class="param-value" id="editorImportColorVal">16</span>
                    </div>
                    <div class="param-row">
                        <span class="param-label">效果</span>
                        <div class="effect-toggle" id="editorEffectToggle">
                            <button type="button" class="effect-btn active" data-effect="standard">🟦 标准</button>
                            <button type="button" class="effect-btn" data-effect="cartoon">🎨 卡通</button>
                        </div>
                    </div>
                    <button class="btn btn-primary btn-block" id="editorImportBtn" disabled>⬆️ 导入并像素化</button>
                    <!-- 自动抠图进度条 -->
                    <div class="cutout-progress" id="cutoutProgress" style="display:none">
                        <div class="cutout-progress-bar" id="cutoutProgressBar"></div>
                        <span class="cutout-progress-pct" id="cutoutProgressPct">0%</span>
                    </div>
                    <span class="cutout-progress-text" id="cutoutProgressText"></span>
                </div>

                <!-- 统计信息（可折叠） -->
                <div class="collapse-header" id="statsHeader">📊 统计</div>
                <div class="collapse-body" id="statsBody">
                    <div class="stats-text" id="editorStats">
                        <p style="color:var(--text-muted)">暂无数据</p>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="action-row">
                    <button class="btn btn-primary" id="editorDownloadBtn">📥 下载</button>
                    <button class="btn btn-secondary" id="editorClearBtn">🗑️ 清空</button>
                </div>

            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <!-- 裁剪弹窗 -->
    <div class="crop-modal" id="cropModal">
        <div class="crop-modal-box">
            <div class="crop-modal-header">
                <span>✂️ 裁剪图片</span>
                <button class="crop-close" id="cropClose" aria-label="关闭">✕</button>
            </div>
            <div class="crop-stage" id="cropStage">
                <img id="cropImage" alt="待裁剪图片">
                <div class="crop-mask" id="cropMaskTop"></div>
                <div class="crop-mask" id="cropMaskBottom"></div>
                <div class="crop-mask" id="cropMaskLeft"></div>
                <div class="crop-mask" id="cropMaskRight"></div>
                <div class="crop-select" id="cropSelect"></div>
            </div>
            <div class="crop-modal-footer">
                <span class="crop-info" id="cropInfo"></span>
                <div class="crop-actions">
                    <button class="btn btn-secondary" id="cropReset">🔄 全选</button>
                    <button class="btn btn-primary" id="cropConfirm">✅ 确认裁剪</button>
                </div>
            </div>
        </div>
    </div>

    <script src="colors.js"></script>
    <script src="create.js"></script>
    <script src="shared.js"></script>
</body>
</html>
