    <style>
        .create-page .container {
            max-width: 100%;
            margin: 0;
            padding: 0;
        }

        /* ===== 顶层布局 ===== */
        .create-wrapper {
            display: flex;
            height: calc(100vh - 60px);
            margin-top: 60px;
        }

        /* ===== 左侧面板 ===== */
        .create-sidebar {
            width: 300px;
            min-width: 300px;
            background: #f8f9fc;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== 右侧面板 ===== */
        .create-sidebar-right {
            width: 260px;
            min-width: 260px;
            background: #f8f9fc;
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
        }

        .sidebar-scroll::-webkit-scrollbar { width: 4px; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }

        /* 工具按钮行（绘制工具一组） */
        .tool-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .tool-bar .tool-btn {
            flex: 1;
            min-width: 0;
            padding: 8px 2px 7px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            background: #fff;
            cursor: pointer;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            line-height: 1.2;
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            transition: all 0.18s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .tool-bar .tool-icon {
            font-size: 1.05rem;
            line-height: 1;
            pointer-events: none;
        }
        .tool-bar .tool-label {
            font-size: 0.72rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .tool-bar .tool-btn:hover {
            border-color: var(--primary-color);
            background: rgba(124, 127, 179, 0.08);
            transform: translateY(-1px);
        }
        .tool-bar .tool-btn:active { transform: translateY(0); }
        .tool-bar .tool-btn:focus-visible {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }
        .tool-bar .tool-btn.active {
            background: var(--bg-gradient);
            border-color: var(--primary-color);
            box-shadow: 0 3px 10px rgba(124, 127, 179, 0.28);
        }
        .tool-bar .tool-btn.active .tool-label { color: #fff; }

        /* 视图开关行：独立一行，图标+文字横向 */
        .tool-bar--view .tool-btn {
            flex-direction: row;
            justify-content: center;
            gap: 6px;
            padding: 8px 12px;
        }
        .tool-bar--view .tool-label { font-size: 0.78rem; }
        .color-cell-label {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            line-height: 1;
            pointer-events: none;
        }

        /* 设置行（网格+色卡） */
        .settings-row {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .settings-row select {
            flex: 1;
            min-width: 0;
            padding: 6px 8px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.8rem;
            background: white;
        }
        .settings-row select:focus { outline: none; border-color: var(--primary-color); }
        .settings-row input[type="number"] {
            width: 48px;
            padding: 6px 4px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.8rem;
            text-align: center;
        }

        /* 当前颜色显示 */
        .current-color-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: white;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 2px solid var(--border-color);
        }
        .current-color-swatch {
            width: 32px; height: 32px;
            border-radius: 6px;
            border: 2px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            flex-shrink: 0;
        }
        .current-color-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-dark);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 色板 */
        .palette-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(30px, 1fr));
            gap: 3px;
            margin-bottom: 12px;
        }
        .palette-grid .color-cell {
            aspect-ratio: 1;
            border-radius: 3px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.12s ease;
            position: relative;
        }
        .palette-grid .color-cell:hover {
            transform: scale(1.25);
            z-index: 2;
            border-color: #333;
        }
        .palette-grid .color-cell.selected {
            border-color: #333;
            box-shadow: 0 0 0 2px white, 0 0 0 4px #333;
        }

        /* 可折叠区域 */
        .collapse-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 8px;
            margin: 6px 0 2px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-dark);
            user-select: none;
            border-top: 1px solid var(--border-color);
            border-radius: 8px;
            transition: background 0.15s ease;
        }
        .collapse-header:first-child { border-top: none; margin-top: 0; }
        .collapse-header:hover { background: rgba(124, 127, 179, 0.08); }
        .collapse-header::after {
            content: '▾';
            font-size: 0.7rem;
            color: var(--text-muted);
            transition: transform 0.2s;
        }
        .collapse-header.collapsed::after { transform: rotate(-90deg); }
        .collapse-body { overflow: hidden; transition: max-height 0.25s ease; max-height: 500px; }
        .collapse-body.collapsed { max-height: 0; }

        /* 导入区 */
        .import-area {
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            padding: 16px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            margin-bottom: 8px;
        }
        .import-area:hover { border-color: var(--primary-color); background: rgba(244,160,184,0.04); }
        .import-area.dragover { border-color: var(--secondary-color); transform: scale(1.02); }
        .import-area .icon { font-size: 1.8rem; margin-bottom: 4px; }
        .import-area .label { font-size: 0.85rem; font-weight: 600; }
        .import-area .hint { font-size: 0.75rem; color: var(--text-muted); }

        /* 参数行（标签 + 控件统一布局） */
        .param-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 0;
        }
        .param-row .param-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-dark);
            flex-shrink: 0;
            min-width: 34px;
        }
        .param-row .param-value {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary-color);
            background: rgba(124, 127, 179, 0.12);
            border-radius: 20px;
            padding: 2px 10px;
            min-width: 30px;
            text-align: center;
            flex-shrink: 0;
        }

        /* 滑块（品牌色自定义轨道与滑块头） */
        .param-row input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: rgba(124, 127, 179, 0.18);
            outline: none;
            cursor: pointer;
        }
        .param-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--bg-gradient);
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(124, 127, 179, 0.4);
            cursor: grab;
        }
        .param-row input[type="range"]::-webkit-slider-thumb:active { cursor: grabbing; }
        .param-row input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary-color);
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(124, 127, 179, 0.4);
            cursor: grab;
        }
        .param-row input[type="range"]::-moz-range-track {
            height: 6px;
            border-radius: 3px;
            background: rgba(124, 127, 179, 0.18);
        }

        /* 自动抠图进度条 */
        .cutout-progress {
            margin: 10px 0 2px;
            background: #f0f0f5;
            border-radius: 20px;
            height: 18px;
            position: relative;
            overflow: hidden;
        }
        .cutout-progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #F4A0B8, #8A6FE8);
            border-radius: 20px;
            transition: width 0.2s ease;
        }
        .cutout-progress-pct {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.25);
            pointer-events: none;
            line-height: 1;
        }
        .cutout-progress.error .cutout-progress-bar {
            background: #E24B4A;
        }
        .cutout-progress-text {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
            text-align: center;
            min-height: 1em;
        }
        .cutout-progress.error ~ .cutout-progress-text {
            color: #C0392B;
        }

        /* 统计 */
        .stats-text { font-size: 0.82rem; color: var(--text-dark); line-height: 1.7; }
        .stats-text b { color: var(--primary-color); }
        .stats-color-list {
            max-height: 110px;
            overflow-y: auto;
            font-size: 0.78rem;
            margin-top: 6px;
        }
        .stats-color-list::-webkit-scrollbar { width: 3px; }
        .stats-color-list::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

        /* 按钮区域 */
        .action-row {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }
        .action-row .btn {
            flex: 1;
            min-height: 40px;
            padding: 8px 12px;
            font-size: 0.82rem;
            justify-content: center;
        }
        /* 全宽按钮（导入并像素化） */
        .btn-block {
            width: 100%;
            justify-content: center;
        }

        /* 缩略图操作按钮组（2×2 网格） */
        .thumb-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 8px;
        }
        .thumb-actions .btn {
            min-height: 34px;
            padding: 6px 4px;
            font-size: 0.75rem;
            justify-content: center;
        }

        /* ===== 右侧画布区 ===== */
        .create-canvas-area {
            flex: 1;
            display: flex;
            background: #f0f1f5;
            overflow: hidden;
            padding: 20px;
            position: relative;
        }
        /* canvas 用 margin:auto 居中：容器溢出时左上角仍可滚动到（flex justify-content 居中会裁掉负坐标部分） */
        .create-canvas-area canvas {
            margin: auto;
            flex-shrink: 0;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: crosshair;
            background: white;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        .create-zoom-control {
            position: absolute;
            top: 28px;
            right: 28px;
            display: flex;
            align-items: center;
            gap: 2px;
            background: rgba(26,26,46,0.85);
            padding: 3px;
            border-radius: 12px;
            z-index: 10;
        }
        .create-zoom-control button {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            min-width: 30px;
            height: 28px;
            border-radius: 8px;
            cursor: pointer;
            line-height: 1;
            padding: 0;
            font-family: inherit;
        }
        .create-zoom-control button:hover { background: rgba(255,255,255,0.15); }
        .create-zoom-control button:active { background: rgba(255,255,255,0.28); }
        .create-zoom-control #createZoomBadge {
            font-size: 12px;
            font-weight: 600;
            min-width: 52px;
            letter-spacing: 0.3px;
        }
        .canvas-tip {
            color: var(--text-muted);
            font-size: 1rem;
            text-align: center;
        }
        .canvas-tip span { font-size: 3rem; display: block; margin-bottom: 10px; }

        /* ===== 响应式: 平板横向 ===== */
        @media (max-width: 1024px) {
            .create-wrapper {
                flex-direction: column;
                height: auto;
                min-height: calc(100vh - 60px);
            }
            .create-sidebar {
                width: 100%;
                min-width: 0;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                max-height: 45vh;
            }
            .sidebar-scroll {
                padding: 10px 14px;
            }
            .palette-grid {
                grid-template-columns: repeat(auto-fill, minmax(34px, 1fr));
                max-height: 140px;
            }
            .create-canvas-area {
                min-height: 50vh;
                padding: 12px;
            }

            /* Tablet: bigger touch targets */
            .tool-bar .tool-btn {
                min-height: 52px;
                padding: 10px 4px 9px;
            }
            .tool-bar .tool-icon { font-size: 1.2rem; }
            .tool-bar .tool-label { font-size: 0.8rem; }
            .settings-row select,
            .settings-row input[type="number"] {
                min-height: 40px;
                font-size: 0.9rem;
            }
            .palette-grid .color-cell {
                min-width: 36px;
                min-height: 36px;
            }
            .import-area {
                padding: 20px 12px;
            }
            .action-row .btn {
                min-height: 44px;
                font-size: 0.9rem;
            }
        }

        /* ===== 响应式: 平板 ===== */
        @media (max-width: 1100px) {
            .create-sidebar { width: 260px; min-width: 260px; }
            .create-sidebar-right { width: 230px; min-width: 230px; }
        }

        /* ===== 响应式: 小平板 / 手机 ===== */
        @media (max-width: 900px) {
            .create-wrapper { flex-wrap: wrap; height: auto; }
            .create-sidebar {
                width: 50%; min-width: 0; max-height: 40vh;
            }
            .create-sidebar-right {
                width: 50%; min-width: 0; max-height: 40vh;
                border-left: 1px solid var(--border-color);
            }
            .create-canvas-area { min-height: 55vh; padding: 10px; width: 100%; }
            .palette-grid {
                grid-template-columns: repeat(auto-fill, minmax(32px, 1fr));
                max-height: 100px;
            }
        }

        /* ===== 响应式: 手机 ===== */
        @media (max-width: 640px) {
            .collapse-body.collapsed-mobile { max-height: 0; }
            .collapse-header.collapsed-mobile::after { transform: rotate(-90deg); }
            .create-wrapper { margin-top: 50px; min-height: auto; flex-wrap: wrap; }
            .create-sidebar { width: 100%; max-height: 35vh; border-right: none; border-bottom: 1px solid var(--border-color); }
            .create-sidebar-right { width: 100%; max-height: 35vh; border-left: none; }
            .sidebar-scroll { padding: 8px 10px; }
            .tool-bar { gap: 6px; margin-bottom: 10px; }
            .tool-bar .tool-btn { min-height: 44px; padding: 7px 2px 6px; }
            .tool-bar .tool-icon { font-size: 1rem; }
            .tool-bar .tool-label { font-size: 0.68rem; }
            .tool-bar--view .tool-btn { padding: 8px 10px; }
            .palette-grid {
                grid-template-columns: repeat(auto-fill, minmax(28px, 1fr));
                gap: 2px;
                max-height: 80px;
            }
            .create-canvas-area { min-height: 50vh; padding: 8px; width: 100%; }
            .current-color-bar { padding: 6px 10px; }
            .current-color-swatch { width: 26px; height: 26px; }
        }

        /* ===== 图片预览放大弹窗 ===== */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lightbox-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            cursor: zoom-out;
        }
        .lightbox-img {
            position: relative;
            max-width: 90vw;
            max-height: 88vh;
            border-radius: 10px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
            background: #fff;
        }
        .lightbox-close {
            position: absolute;
            top: 18px;
            right: 22px;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.22);
            color: #fff;
            font-size: 1.1rem;
            line-height: 1;
            cursor: pointer;
            transition: background 0.15s;
        }
        .lightbox-close:hover { background: rgba(255, 255, 255, 0.38); }

        /* ===== 抠图边缘精修弹窗 ===== */
        .refine-modal {
            position: fixed;
            inset: 0;
            z-index: 1100;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .refine-box {
            background: #fff;
            border-radius: 12px;
            width: min(96vw, 900px);
            max-height: 94vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            overflow: hidden;
        }
        .refine-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 0.95rem;
            border-bottom: 1px solid var(--border-color);
        }
        .refine-tip { font-size: 0.75rem; color: var(--text-muted); font-weight: 400; margin-left: auto; }
        .refine-close {
            background: none;
            border: none;
            font-size: 1.1rem;
            line-height: 1;
            cursor: pointer;
            color: var(--text-muted);
            padding: 4px 6px;
            border-radius: 6px;
        }
        .refine-close:hover { background: rgba(0, 0, 0, 0.06); }
        .refine-stage {
            position: relative;
            margin: 0 16px;
            height: 55vh;
            overflow: hidden;
            background: #e8e8ee;
            border-radius: 8px;
            cursor: crosshair;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .refine-stage canvas {
            position: absolute;
            left: 0;
            top: 0;
            transform-origin: 0 0;
        }
        .refine-cursor {
            position: absolute;
            left: 0;
            top: 0;
            width: 40px;
            height: 40px;
            border: 2px solid #7C7FB3;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 5;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.85);
        }
        .refine-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
        }
        .refine-tools { display: flex; gap: 6px; }
        .refine-btn {
            padding: 6px 12px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            background: #fff;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        .refine-btn.active {
            background: var(--bg-gradient);
            border-color: var(--primary-color);
            color: #fff;
        }
        .refine-brush { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--text-dark); }
        .refine-brush input[type="range"] { width: 100px; accent-color: var(--primary-color); }
        .refine-brush span:last-child { font-weight: 700; color: var(--primary-color); min-width: 22px; text-align: right; }
        .refine-actions { display: flex; gap: 8px; margin-left: auto; }
        .refine-actions .btn { padding: 7px 14px; font-size: 0.82rem; }

        /* ===== 裁剪弹窗 ===== */
        .crop-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0,0,0,0.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .crop-modal.show { display: flex; }
        .crop-modal-box {
            background: #fff;
            border-radius: 12px;
            width: min(92vw, 560px);
            max-height: 88vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
            overflow: hidden;
        }
        .crop-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 0.95rem;
            border-bottom: 1px solid var(--border-color);
        }
        .crop-close {
            background: none;
            border: none;
            font-size: 1.1rem;
            line-height: 1;
            cursor: pointer;
            color: var(--text-muted);
            padding: 4px 6px;
            border-radius: 6px;
        }
        .crop-close:hover { background: rgba(0,0,0,0.06); }
        .crop-stage {
            position: relative;
            margin: 16px;
            max-height: 55vh;
            overflow: hidden;
            background: #ececf2;
            border-radius: 8px;
            cursor: crosshair;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .crop-stage img {
            display: block;
            max-width: 100%;
            max-height: 55vh;
            margin: 0 auto;
            pointer-events: none;
        }
        .crop-mask { position: absolute; background: rgba(0,0,0,0.45); pointer-events: none; }
        .crop-select {
            position: absolute;
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.85);
            box-sizing: border-box;
            pointer-events: none;
        }
        .crop-modal-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
        }
        .crop-info {
            font-size: 0.8rem;
            color: var(--text-muted);
            flex: 1;
            min-width: 120px;
        }
        .crop-actions { display: flex; gap: 8px; }
        .crop-actions .btn { padding: 8px 14px; font-size: 0.85rem; }

        /* ===== 数字人悬浮窗（豆豆） ===== */
        .xmov-fab {
            position: fixed;
            right: 24px;
            bottom: 24px;
            width: 64px;
            height: 64px;
            border: 2px solid #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            z-index: 9990;
            overflow: hidden;
            background: linear-gradient(135deg, #7C7FB3 0%, #9D9EC8 100%);
            transition: all 0.2s ease;
        }
        .xmov-fab:hover { transform: scale(1.05); }
        .xmov-fab.hidden { display: none; }
        .xmov-fab img { width: 100%; height: 100%; object-fit: cover; }

        .xmov-fab-tip {
            position: fixed;
            right: 24px;
            bottom: 100px;
            background: rgba(0, 0, 0, 0.78);
            color: #fff;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 0.82rem;
            max-width: 280px;
            display: none;
            z-index: 9980;
            line-height: 1.5;
        }
        .xmov-fab-tip.show { display: block; }

        .xmov-window {
            position: fixed;
            right: 0;
            bottom: 20px;
            width: 437px;
            max-width: 90vw;
            display: none;
            z-index: 9995;
        }
        .xmov-window.open { display: block; }

        .xmov-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            cursor: pointer;
            position: relative;
        }

        .xmov-hint {
            text-align: center;
            font-size: 0.8rem;
            color: rgba(0, 0, 0, 0.55);
            margin-top: 4px;
            min-height: 20px;
            pointer-events: none;
        }

        .xmov-close {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.35);
            color: #fff;
            font-size: 0.8rem;
            line-height: 1;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 2;
        }
        .xmov-window:hover .xmov-close { opacity: 1; }
    </style>

<body class="create-page">

        <!-- 右侧面板：导入、统计、操作 -->

                    <!-- 自动抠图进度条 -->
                    <div class="cutout-progress" id="cutoutProgress" style="display:none">

                <!-- 操作按钮 -->
                <div class="action-row">

    <div id="footer-placeholder"></div>

    <!-- 裁剪弹窗 -->

    <!-- 图片预览放大弹窗 -->

    <!-- 抠图边缘精修弹窗 -->

        <div class="refine-box">

                <span>🧹 边缘精修</span>

                </div>
                <div class="refine-brush">
                    <span>刷子大小</span>
                    <input type="range" id="refineBrushSize" min="4" max="80" value="20">
                    <span id="refineBrushVal">20</span>
                </div>
                <div class="refine-actions">
                    <button type="button" class="btn btn-secondary" id="refineUndoBtn">↩️ 撤销</button>
                    <button type="button" class="btn btn-secondary" id="refineResetBtn">🔄 重置</button>

    <!-- 数字人悬浮球（豆豆） -->
    <button class="xmov-fab" id="xmovFab" title="打开数字人豆豆">
        <img src="shuziren.jpeg" alt="豆豆">
    </button>
    <div class="xmov-fab-tip" id="xmovFabTip"></div>
    <div class="xmov-window" id="xmovWindow">
        <div class="xmov-container" id="xmovContainer"></div>
        <button class="xmov-close" id="xmovClose" aria-label="关闭">✕</button>
        <div class="xmov-hint" id="xmovHint">点击豆豆对话</div>
    </div>

    <script src="colors.js"></script>
    <script src="create.js"></script>
    <script src="shared.js"></script>
    <script src="https://media.xingyun3d.com/xingyun3d/general/litesdk/xmovAvatar@latest.js"></script>
    <script>
        // ===== 数字人豆豆（悬浮窗 + 语音对话） =====
        (function () {
            const fab = document.getElementById('xmovFab');
            const fabTip = document.getElementById('xmovFabTip');
            const win = document.getElementById('xmovWindow');
            const container = document.getElementById('xmovContainer');
            const closeBtn = document.getElementById('xmovClose');
            const hint = document.getElementById('xmovHint');
            const setHint = (t) => { hint.textContent = t; };

            let avatar = null;
            let initialized = false;
            let listening = false;
            let initFailed = false;   // 初始化失败（积分不足等）后，避免重复 init

            function isWebGL2Supported() {
                try {
                    const c = document.createElement('canvas');
                    return !!(c.getContext('webgl2'));
                } catch (e) { return false; }
            }

            function xorDecode(encoded) {
                const key = 'pindou-dou';
                const bytes = atob(encoded);
                let result = '';
                for (let i = 0; i < bytes.length; i++) {
                    result += String.fromCharCode(bytes.charCodeAt(i) ^ key.charCodeAt(i % key.length));
                }
                return result;
            }

            function showFabTip(msg) {
                fabTip.textContent = msg;
                fabTip.classList.add('show');
                clearTimeout(fabTip._timer);
                fabTip._timer = setTimeout(() => fabTip.classList.remove('show'), 3500);
            }

            // 悬浮球 → 展开/收起
            fab.addEventListener('click', () => {
                if (!isWebGL2Supported()) {
                    showFabTip('当前浏览器不支持 WebGL2，无法显示数字人，请更换 Chrome/Edge 浏览器');
                    return;
                }
                if (initFailed) {
                    showFabTip('数字人积分不足，无法打开，请联系管理员充值后重试');
                    return;
                }
                win.classList.add('open');
                fab.classList.add('hidden');
                if (!initialized) initAvatar();
                else avatar.switchInvisibleMode();
            });

            closeBtn.addEventListener('click', () => {
                win.classList.remove('open');
                fab.classList.remove('hidden');
                if (avatar && initialized) avatar.switchInvisibleMode();
                stopListening();
            });

            function initAvatar() {
                setHint('正在加载豆豆…');
                avatar = new XmovAvatar({
                    containerId: '#xmovContainer',
                    appId: xorDecode('EwxYBlpFSwYKFkQLWlEOQE9RV0RIXltXDhNLUFYXSAo='),
                    appSecret: xorDecode('QQ0NUQlHTgAKEEhfWlFfFEwGCUBEXA1dW0YaVlpARAw='),
                    gatewayServer: 'https://nebula-agent.xingyun3d.com/user/v1/ttsa/session',
                    onMessage(error) {
                        console.error('SDK 错误:', error.code, error.message);
                        // 初始化阶段错误（积分不足/会话失败），收起窗口 + 气泡提示
                        if (!initialized) {
                            const msg = error.message || '';
                            if (/积分|额度|余额|quota|balance|credit|充值|insufficient/i.test(msg) || error.code === 10003) {
                                initFailed = true;
                                win.classList.remove('open');
                                fab.classList.remove('hidden');
                                showFabTip('数字人积分不足，无法打开，请联系管理员充值后重试');
                                return;
                            }
                        }
                        setHint('出错：' + error.message);
                    },
                    proxyWidget: {
                        subtitle_on() {},
                        subtitle_off() {},
                    },
                });
                avatar.init({
                    onDownloadProgress(progress) {
                        if (progress >= 100) setHint('点击豆豆对话');
                        else setHint('加载中… ' + progress + '%');
                    },
                }).then(() => {
                    initialized = true;
                    setHint('点击豆豆对话');
                    avatar.speak('<speak>你好，我是你的小助手豆豆，点击我就可以和你聊天啦。</speak>', true, true, { emotion: 'happy' });
                }).catch((err) => {
                    console.error('初始化失败:', err);
                    // 收起窗口 + 气泡提示（避免空白窗口）
                    win.classList.remove('open');
                    fab.classList.remove('hidden');
                    const msg = (err && err.message) ? err.message : String(err);
                    if (/积分|额度|余额|quota|balance|credit|充值|insufficient/i.test(msg)) {
                        initFailed = true;
                        showFabTip('数字人积分不足，无法打开，请联系管理员充值后重试');
                    } else {
                        showFabTip('数字人初始化失败：' + msg);
                    }
                });
            }

            // 语音识别
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            let recognition = null;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'zh-CN';
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.onresult = (e) => {
                    const text = e.results[0][0].transcript;
                    setHint('你说：' + text);
                    reply(text);
                };
                recognition.onerror = (e) => {
                    listening = false;
                    if (e.error === 'not-allowed') setHint('麦克风权限被拒绝');
                    else if (e.error === 'no-speech') setHint('没听到声音，再点一次试试');
                    else setHint('识别出错：' + e.error);
                };
                recognition.onend = () => { listening = false; };
            }

            function startListening() {
                if (!recognition) return;
                if (listening) return;
                listening = true;
                setHint('正在听，请说话…');
                recognition.start();
            }
            function stopListening() {
                if (recognition && listening) { recognition.stop(); listening = false; }
            }

            container.addEventListener('click', () => {
                if (!initialized) return;
                startListening();
            });

            // DeepSeek LLM 对话
            const history = [];
            async function callLLM(userText) {
                const res = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + xorDecode('AwJDVg1HTlxXTUdQW1daQRwCDRRCX1ZVXBAVUVhEQlteXVY='),
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            { role: 'system', content: '你的名字叫"豆豆"，是"拼豆王国"网站的小助手，一个可爱的数字人。负责引导用户使用"拼豆王国"（一个免费在线拼豆图纸生成器，支持照片转像素画、抠图、动漫化、多品牌色卡匹配）。回答要求：简短口语化、适合语音播报、一句话到三句话、不要markdown、不要emoji、不要列表、不要特殊符号。' },
                            ...history,
                            { role: 'user', content: userText },
                        ],
                        temperature: 0.7,
                        max_tokens: 200,
                    }),
                });
                const data = await res.json();
                if (!res.ok) {
                    const err = new Error(data.error ? data.error.message : ('HTTP ' + res.status));
                    err.status = res.status;
                    throw err;
                }
                if (data.choices && data.choices[0]) return data.choices[0].message.content;
                throw new Error(data.error ? data.error.message : 'LLM 返回异常');
            }

            async function reply(text) {
                setHint('思考中…');
                try {
                    const answer = await callLLM(text);
                    history.push({ role: 'user', content: text });
                    history.push({ role: 'assistant', content: answer });
                    setHint('');
                    if (avatar && initialized) {
                        avatar.speak('<speak>' + answer + '</speak>', true, true, { emotion: 'happy' });
                    }
                } catch (err) {
                    console.error('LLM 调用失败:', err);
                    const msg = (err && err.message) ? err.message : String(err);
                    if ((err && err.status === 402) || /余额|insufficient|balance|quota|费用|credit/i.test(msg)) {
                        setHint('大模型费用不足');
                        if (avatar && initialized) {
                            avatar.speak('<speak>抱歉，我的智能大脑余额不足了，请联系管理员充值。</speak>', true, true);
                        }
                    } else {
                        setHint('网络开小差了，再说一次试试');
                        if (avatar && initialized) {
                            avatar.speak('<speak>抱歉，我刚刚走神了，能再说一次吗？</speak>', true, true);
                        }
                    }
                }
            }

            window.addEventListener('beforeunload', () => {
                if (avatar) avatar.destroy('page_unload');
            });
        })();
    </script>
