<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的作品 - 拼豆王国</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://pindou.skin/projects.html">
    <link rel="shortcut icon" href="logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <style>
        .projects-notice {
            background: var(--bg-subtle, #F9FAFB);
            border: 1px solid var(--border-color, #E5E7EB);
            border-left: 4px solid var(--primary-color, #7C7FB3);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.85rem;
            color: var(--text-light, #4B5563);
            line-height: 1.7;
            margin: 16px 0;
        }
        .projects-notice b { color: var(--text-dark, #1F2937); }
        .projects-toolbar { margin: 16px 0; }
        .btn-import {
            padding: 9px 18px; border-radius: 10px; border: none;
            background: var(--bg-gradient); color: #fff; font-weight: 600;
            cursor: pointer; font-size: 0.9rem;
        }
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            margin: 16px 0 40px;
        }
        .project-card {
            background: var(--card-bg, #fff);
            border: 1px solid var(--border-color, #E5E7EB);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.15s ease, transform 0.15s ease;
        }
        .project-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .project-thumb {
            aspect-ratio: 1;
            background: var(--bg-subtle, #F9FAFB);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid var(--border-color, #E5E7EB);
        }
        .project-thumb img {
            width: 100%; height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }
        .project-info { padding: 10px 12px 6px; }
        .project-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-dark);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .project-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
        .project-actions {
            display: flex; gap: 6px; flex-wrap: wrap;
            padding: 0 12px 12px; margin-top: auto;
        }
        .project-actions button {
            flex: 1; min-width: 0;
            padding: 7px 4px;
            font-size: 0.78rem;
            border-radius: 8px;
            border: 1.5px solid var(--border-color);
            background: var(--bg-white, #fff);
            color: var(--text-dark);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
        }
        .project-actions button:hover { border-color: var(--primary-color); }
        .project-actions .act-load { background: var(--bg-gradient); color: #fff; border-color: transparent; }
        .project-actions .act-del { color: var(--danger-color, #EF4444); }
        .project-actions .act-del:hover { border-color: var(--danger-color); }
        .projects-empty {
            text-align: center; padding: 60px 20px; color: var(--text-muted);
        }
        .projects-empty .icon { font-size: 3rem; display: block; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="main-content">
        <div class="content-wrapper">
            <h2 class="section-title">🗂️ 我的作品</h2>
            <p class="section-desc">保存在当前浏览器本地的历史图纸，可随时加载继续编辑或下载</p>

            <div class="projects-notice">
                ℹ️ 作品仅保存在<b>当前浏览器本地</b>，不会上传服务器。清除浏览器数据、使用无痕模式、更换设备或浏览器都会导致记录丢失。建议重要作品点击卡片「导出」备份为 JSON 文件，需要时用「导入」恢复。
            </div>

            <div class="projects-toolbar">
                <button class="btn-import" id="importBtn">📥 导入 JSON</button>
                <input type="file" id="importFile" accept=".json,application/json" style="display:none">
            </div>

            <div id="projectsGrid" class="projects-grid"></div>

            <div id="projectsEmpty" class="projects-empty" style="display:none">
                <span class="icon">🎨</span>
                <p>还没有保存的作品</p>
                <p style="margin-top:8px">去 <a href="index.html#generator">生成器</a> 或 <a href="create.html">创作页</a> 生成图纸后点击「保存作品」</p>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="shared.js" defer></script>
    <script src="common.js" defer></script>
    <script src="storage.js" defer></script>
    <script src="projects.js" defer></script>
</body>
</html>
